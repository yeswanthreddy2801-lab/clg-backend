name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit Tests
        run: npm run test

      - name: Run Integration Tests
        run: |
          docker-compose up -d redis postgres kafka zookeeper opensearch
          sleep 15
          npm run test:e2e --workspace=apps/api

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Push Docker image
        run: |
          # Normally we would login to a container registry here
          # echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t api-service:latest -f apps/api/Dockerfile .
          # docker tag api-service:latest ghcr.io/${{ github.repository }}/api-service:latest
          # docker push ghcr.io/${{ github.repository }}/api-service:latest
